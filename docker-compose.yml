services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurolab
      POSTGRES_USER: neurolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurolab_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurolab -d neurolab"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NEUROLAB_ENV: production
      NEUROLAB_SECRET: ${NEUROLAB_SECRET:-change-me-in-production}
      NEUROLAB_DATABASE_URL: postgresql+psycopg://neurolab:${POSTGRES_PASSWORD:-neurolab_dev_password}@postgres:5432/neurolab
      NEUROLAB_STORAGE_DIR: /app/storage
      NEUROLAB_CORS_ORIGINS: ${NEUROLAB_CORS_ORIGINS:-http://localhost:8080}
      NEUROLAB_WORKERS: ${NEUROLAB_WORKERS:-2}
      NEUROLAB_EPOCH_DELAY_MS: ${NEUROLAB_EPOCH_DELAY_MS:-120}
      NEUROLAB_SEED_DEMO: ${NEUROLAB_SEED_DEMO:-true}
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_URL: ""
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  api_storage:
